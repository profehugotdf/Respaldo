<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Backup</title>
<style>
  :root{
    --bg:#0c1015; --bg2:#141a22; --card:#1a212b; --card2:#212a36; --borde:#2a3441;
    --texto:#e7edf3; --texto-sec:#8fa0b3; --acento:#3ddcc4; --acento2:#5ab0ff;
    --ok:#3ddc84; --mal:#ff5470; --radio:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{padding-bottom:40px;}
  header{position:sticky; top:0; z-index:10; background:linear-gradient(180deg,var(--bg) 80%,transparent);
    padding:16px 16px 8px;}
  h1{margin:0 0 2px; font-size:22px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .sub{color:var(--texto-sec); font-size:12.5px; margin-bottom:12px;}
  nav.tabs{display:flex; gap:6px;}
  nav.tabs button{flex:1; padding:10px 4px; border:1px solid var(--borde); background:var(--bg2);
    color:var(--texto-sec); border-radius:12px; font-size:13px; font-weight:700; cursor:pointer;}
  nav.tabs button.activa{background:linear-gradient(135deg,var(--acento),var(--acento2)); color:#04231f; border-color:transparent;}
  main{padding:4px 16px 16px;}
  section{display:none;} section.activa{display:block;}
  .card{background:var(--card); border:1px solid var(--borde); border-radius:var(--radio); padding:14px; margin-bottom:12px;}
  .card h2{margin:0 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:.6px; color:var(--texto-sec); font-weight:700;}
  input[type=text]{width:100%; background:var(--card2); border:1px solid var(--borde); color:var(--texto);
    border-radius:10px; padding:10px 11px; font-size:15px; margin-bottom:10px;}
  input:focus{outline:none; border-color:var(--acento);}
  .fila{display:flex; gap:8px; margin-bottom:10px;}
  .fila > *{flex:1;}
  button.btn{border:none; border-radius:12px; padding:12px 14px; font-size:14.5px; font-weight:700; cursor:pointer;}
  .btn-primario{width:100%; background:linear-gradient(135deg,var(--acento),var(--acento2)); color:#04231f;}
  .btn-secundario{width:100%; background:var(--card2); color:var(--texto); border:1px solid var(--borde);}
  .btn-mini{background:var(--card2); color:var(--texto-sec); border:1px solid var(--borde); padding:9px 10px; font-size:12.5px; border-radius:9px;}
  .item-clave{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--borde); font-size:13.5px; cursor:pointer;}
  .item-clave:last-child{border-bottom:none;}
  .item-clave input[type=checkbox]{width:20px; height:20px; accent-color:var(--acento); margin:0; flex-shrink:0;}
  .item-clave .nombre{flex:1; word-break:break-word;}
  .item-clave .peso{color:var(--texto-sec); font-size:11px; flex-shrink:0;}
  .item-clave .pisa{color:var(--mal); font-size:10.5px; flex-shrink:0;}
  .vacio{color:var(--texto-sec); font-size:13px; text-align:center; padding:20px 10px; line-height:1.5;}
  .resumen{color:var(--texto-sec); font-size:12.5px; margin-bottom:10px;}
  .tss-nota{font-size:11px; color:var(--texto-sec); margin-bottom:10px; line-height:1.5;}
  .seccion-idb{margin-top:12px; padding-top:10px; border-top:1px dashed var(--borde); font-size:12px; color:var(--texto-sec);}
  .aviso{background:#3a2a10; border:1px solid #8a6420; color:#ffd58a; border-radius:10px; padding:10px; font-size:12.5px; line-height:1.5; margin-bottom:10px;}
  .resultado{font-size:12.5px; line-height:1.6; margin-top:10px;}
  .toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ok); color:#04240f;
    padding:10px 18px; border-radius:99px; font-size:13.5px; font-weight:700; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; z-index:99;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
</style>
</head>
<body>

<header>
  <h1>💾 Backup · v2</h1>
  <div class="sub">Exportar / restaurar datos guardados en este dispositivo</div>
  <nav class="tabs">
    <button id="tabBtnExportar" class="activa" onclick="mostrarTab('exportar')">⬆️ Exportar</button>
    <button id="tabBtnImportar" onclick="mostrarTab('importar')">⬇️ Importar</button>
  </nav>
</header>

<main>
  <section id="tab-exportar" class="activa">
    <div class="card">
      <h2>Datos en este dispositivo</h2>
      <input type="text" id="filtroClaves" placeholder="Buscar por nombre..." oninput="renderListaClaves()">
      <div class="fila" style="margin-bottom:8px;">
        <button class="btn btn-mini" onclick="seleccionarTodo(true)">Seleccionar todo</button>
        <button class="btn btn-mini" onclick="seleccionarTodo(false)">Ninguno</button>
      </div>
      <div id="listaClaves"></div>
      <div id="listaIDB"></div>
    </div>
    <div class="card">
      <div class="resumen" id="resumenExport"></div>
      <button class="btn btn-primario" onclick="exportarSeleccion()">⬇️ Descargar backup (.json)</button>
      <div id="resumenDescarga" class="resultado"></div>
      <div class="tss-nota">El archivo que se descarga solo tiene las claves que dejaste tildadas arriba. Pasalo al otro dispositivo por Drive, mail o WhatsApp, y ahí usá la pestaña "Importar".</div>
    </div>
  </section>

  <section id="tab-importar">
    <div class="card">
      <h2>Restaurar desde un backup</h2>
      <button class="btn btn-secundario" onclick="document.getElementById('inputBackup').click()">📂 Elegir archivo .json</button>
      <input type="file" id="inputBackup" accept=".json,application/json" style="display:none" onchange="leerArchivoBackup(event)">
      <div id="previaImportar"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* Changelog
   v2: incluye las bases internas (IndexedDB) de todas las apps del sitio, además de localStorage.
       Bici Indoor (v158+) guarda sus sesiones y rutas en IndexedDB y deja en localStorage solo un resumen
       marcado con _resumen:true (sin el detalle). Formato de archivo v2: agrega "indexedDB".
       Restaurar nunca sube la versión de una base existente (rompería a la app dueña) y nunca borra bases.
   v1: backup y restauración de claves de localStorage. */

let seleccionExport = new Set();
let datosImportar = null;
let seleccionImport = new Set();

function mostrarToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function escapeHtml(v){
  if(v === undefined || v === null) return '';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatearBytes(n){
  if(n < 1024) return n + ' B';
  return (n/1024).toFixed(1) + ' KB';
}

function hoyISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}

/* ============ Lógica pura (testeable sin DOM/localStorage real) ============ */

function listarClaves(storage){
  const claves = [];
  for(let i = 0; i < storage.length; i++) claves.push(storage.key(i));
  return claves.sort();
}

// Arma el objeto de backup a partir de las claves elegidas.
function construirBackup(clavesElegidas, storage, basesIDB){
  const claves = {};
  clavesElegidas.forEach(k => { claves[k] = storage.getItem(k); });
  const b = { version: 2, fecha: new Date().toISOString(), claves };
  if(basesIDB && basesIDB.length) b.indexedDB = basesIDB;
  return b;
}

// Devuelve, de una lista de claves a importar, cuáles ya existen en el storage actual (se van a pisar).
function detectarPisado(clavesAImportar, storage){
  return clavesAImportar.filter(k => storage.getItem(k) !== null);
}

// Aplica la restauración: escribe cada clave elegida en el storage actual. Devuelve la cantidad escrita.
function aplicarImportacion(clavesElegidas, datosBackup, storage){
  let n = 0;
  clavesElegidas.forEach(k => {
    if(Object.prototype.hasOwnProperty.call(datosBackup.claves, k)){
      storage.setItem(k, datosBackup.claves[k]);
      n++;
    }
  });
  return n;
}

/* ============ IndexedDB (lógica testeable con un indexedDB simulado) ============ */
const BASES_CONOCIDAS = ['bici_indoor'];
function idbId(db, store, key){ return 'idb:' + JSON.stringify([db, store, key]); }
function reqP(r){ return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function txFin(tx){ return new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = tx.onabort = () => rej(tx.error || new Error('transacción abortada')); }); }
function serializable(v){
  if((typeof Blob !== 'undefined' && v instanceof Blob) || v instanceof ArrayBuffer || ArrayBuffer.isView(v)) return false;
  try{ JSON.stringify(v); return true; }catch(_){ return false; }
}
// Abre una base SIN crearla si no existe (si no existe, cancela la creación).
function abrirExistente(factory, nombre){
  return new Promise((res) => {
    const r = factory.open(nombre);
    let nueva = false;
    r.onupgradeneeded = (e) => { if(e.oldVersion === 0){ nueva = true; try{ r.transaction.abort(); }catch(_){} } };
    r.onsuccess = () => { if(nueva){ try{ r.result.close(); }catch(_){} res(null); } else res(r.result); };
    r.onerror = () => res(null);
  });
}
// Inventario de TODAS las bases del sitio (genérico: las que se agreguen en el futuro entran solas).
async function inventarioIDB(factory){
  const out = { bases: [], omitidos: [], aviso: '' };
  if(!factory) { out.aviso = 'Este navegador no tiene bases internas (IndexedDB).'; return out; }
  let nombres;
  if(typeof factory.databases === 'function'){ nombres = (await factory.databases()).map(d => d.name).filter(Boolean); }
  else { nombres = BASES_CONOCIDAS.slice(); out.aviso = 'Este navegador no permite listar las bases: solo reviso las conocidas (' + BASES_CONOCIDAS.join(', ') + ').'; }
  for(const nombre of nombres.sort()){
    const db = await abrirExistente(factory, nombre);
    if(!db) continue;
    const base = { nombre, version: db.version, almacenes: [] };
    for(const st of Array.from(db.objectStoreNames)){
      const tx = db.transaction(st, 'readonly'), os = tx.objectStore(st);
      const keys = await reqP(os.getAllKeys()), vals = await reqP(os.getAll());
      const entradas = [];
      keys.forEach((k, i) => { if(serializable(vals[i]) && serializable(k)) entradas.push([k, vals[i]]); else out.omitidos.push(nombre + ' › ' + st + ' › ' + String(k)); });
      base.almacenes.push({ nombre: st, keyPath: os.keyPath, autoIncrement: !!os.autoIncrement, entradas });
    }
    db.close();
    out.bases.push(base);
  }
  return out;
}
function tamanioValor(v){ const s = typeof v === 'string' ? v : JSON.stringify(v); return typeof Blob !== 'undefined' ? new Blob([s]).size : s.length; }
// Filtra el inventario dejando solo las entradas elegidas (ids 'idb:[db,store,key]').
function filtrarIDB(inv, seleccion){
  const bases = [];
  for(const b of inv.bases){
    const almacenes = [];
    for(const a of b.almacenes){ const entradas = a.entradas.filter(([k]) => seleccion.has(idbId(b.nombre, a.nombre, k)));
      if(entradas.length) almacenes.push({ nombre: a.nombre, keyPath: a.keyPath, autoIncrement: a.autoIncrement, entradas }); }
    if(almacenes.length) bases.push({ nombre: b.nombre, version: b.version, almacenes });
  }
  return bases;
}
// Restaura las entradas elegidas. Crea la base (con SU versión del backup) solo si no existe. Si la base existe y le
// falta un almacén, NO sube la versión (la app dueña la abre con versión fija y dejaría de funcionar): avisa y saltea.
async function restaurarIDB(factory, basesBackup, seleccion){
  const informe = [];
  for(const b of basesBackup){
    const elegidas = b.almacenes.map(a => ({ ...a, entradas: a.entradas.filter(([k]) => seleccion.has(idbId(b.nombre, a.nombre, k))) })).filter(a => a.entradas.length);
    if(!elegidas.length) continue;
    let db = await abrirExistente(factory, b.nombre);
    if(!db){
      db = await new Promise((res, rej) => { const r = factory.open(b.nombre, b.version || 1);
        r.onupgradeneeded = () => { for(const a of b.almacenes) if(!r.result.objectStoreNames.contains(a.nombre)) r.result.createObjectStore(a.nombre, a.keyPath != null ? { keyPath: a.keyPath, autoIncrement: a.autoIncrement } : { autoIncrement: a.autoIncrement }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    }
    for(const a of elegidas){
      const fila = { base: b.nombre, almacen: a.nombre, escritas: 0, verificadas: 0, error: '' };
      if(!db.objectStoreNames.contains(a.nombre)){ fila.error = 'a la base le falta este almacén: abrí una vez la app correspondiente y volvé a restaurar'; informe.push(fila); continue; }
      try{
        const tx = db.transaction(a.nombre, 'readwrite'), os = tx.objectStore(a.nombre);
        for(const [k, v] of a.entradas){ if(os.keyPath != null) os.put(v); else os.put(v, k); fila.escritas++; }
        await txFin(tx);
        const tr = db.transaction(a.nombre, 'readonly'), or = tr.objectStore(a.nombre);
        for(const [k, v] of a.entradas){ const back = await reqP(or.get(k)); if(JSON.stringify(back) === JSON.stringify(v)) fila.verificadas++; }
      }catch(e){ fila.error = e && e.message || String(e); }
      informe.push(fila);
    }
    db.close();
  }
  return informe;
}
// Avisos al revisar un backup antes de restaurarlo.
function avisosBackup(datos){
  const av = [], bases = (datos.indexedDB || []).map(b => b.nombre);
  for(const [k, v] of Object.entries(datos.claves || {})){
    let arr = null; try{ arr = JSON.parse(v); }catch(_){}
    if(Array.isArray(arr) && arr.length && arr.every(x => x && x._resumen)){
      const app = k.split('_')[0];
      if(!bases.some(n => n.startsWith(app)))
        av.push('«' + k + '» en este backup es solo el resumen (sin el detalle de cada sesión) y el archivo no trae la base interna de esa app: no contiene las sesiones completas. Restaurarlo no borra las que ya tengas.');
    } else if(k === 'bici_sesiones' && Array.isArray(arr) && arr.length && !bases.includes('bici_indoor')){
      av.push('Backup anterior al cambio de Bici: las sesiones completas vienen en «bici_sesiones». Al abrir Bici, las pasa sola a su base interna, combinándolas con las que ya tengas.');
    }
  }
  return av;
}

/* ============ Tabs ============ */
function mostrarTab(nombre){
  document.getElementById('tab-exportar').classList.toggle('activa', nombre==='exportar');
  document.getElementById('tab-importar').classList.toggle('activa', nombre==='importar');
  document.getElementById('tabBtnExportar').classList.toggle('activa', nombre==='exportar');
  document.getElementById('tabBtnImportar').classList.toggle('activa', nombre==='importar');
  if(nombre === 'exportar') renderListaClaves();
}

/* ============ Exportar ============ */
function renderListaClaves(){
  const filtro = (document.getElementById('filtroClaves').value || '').toLowerCase();
  const todas = listarClaves(localStorage);
  const claves = todas.filter(k => k.toLowerCase().includes(filtro));
  const cont = document.getElementById('listaClaves');

  if(todas.length === 0){
    cont.innerHTML = '<div class="vacio">No encontré datos guardados en este dispositivo.</div>';
  } else if(claves.length === 0){
    cont.innerHTML = '<div class="vacio">Ninguna clave coincide con la búsqueda.</div>';
  } else {
    cont.innerHTML = claves.map(k => {
      const valor = localStorage.getItem(k) || '';
      const bytes = new Blob([valor]).size;
      const checked = seleccionExport.has(k) ? 'checked' : '';
      return `<label class="item-clave">
        <input type="checkbox" ${checked} onchange="toggleSeleccionExport(${JSON.stringify(k)})">
        <span class="nombre">${escapeHtml(k)}</span>
        <span class="peso">${formatearBytes(bytes)}</span>
      </label>`;
    }).join('');
  }
  renderListaIDB();
  actualizarResumenExport();
}

let inventario = { bases: [], omitidos: [], aviso: '' }, inventarioListo = false;
async function cargarInventario(){
  try{ inventario = await inventarioIDB(window.indexedDB); }catch(e){ inventario = { bases: [], omitidos: [], aviso: 'No pude leer las bases internas: ' + e.message }; }
  inventarioListo = true; renderListaIDB(); actualizarResumenExport();
}
function idsInventario(){ const ids = []; for(const b of inventario.bases) for(const a of b.almacenes) for(const [k] of a.entradas) ids.push(idbId(b.nombre, a.nombre, k)); return ids; }
function renderListaIDB(){
  const cont = document.getElementById('listaIDB'); if(!cont) return;
  const filtro = (document.getElementById('filtroClaves').value || '').toLowerCase();
  if(!inventarioListo){ cont.innerHTML = '<div class="seccion-idb">Buscando bases internas…</div>'; return; }
  let filas = '';
  for(const b of inventario.bases) for(const a of b.almacenes) for(const [k, v] of a.entradas){
    const nombre = b.nombre + ' › ' + (a.nombre === 'kv' ? '' : a.nombre + ' › ') + String(k);
    if(!nombre.toLowerCase().includes(filtro)) continue;
    const id = idbId(b.nombre, a.nombre, k);
    filas += `<label class="item-clave"><input type="checkbox" ${seleccionExport.has(id) ? 'checked' : ''} onchange='toggleSeleccionExport(${JSON.stringify(id)})'>
      <span class="nombre">🗄️ ${escapeHtml(nombre)}</span><span class="peso">${formatearBytes(tamanioValor(v))}</span></label>`;
  }
  cont.innerHTML = '<div class="seccion-idb">Bases internas (IndexedDB) — acá están las sesiones completas de las apps que ya migraron (Bici).</div>'
    + (inventario.aviso ? '<div class="aviso">' + escapeHtml(inventario.aviso) + '</div>' : '')
    + (filas || '<div class="vacio">No hay bases internas en este dispositivo.</div>')
    + (inventario.omitidos.length ? '<div class="aviso">No se pueden copiar (no son texto/JSON): ' + escapeHtml(inventario.omitidos.join(', ')) + '</div>' : '');
}
function toggleSeleccionExport(key){
  if(seleccionExport.has(key)) seleccionExport.delete(key); else seleccionExport.add(key);
  actualizarResumenExport();
}

function seleccionarTodo(marcar){
  seleccionExport = marcar ? new Set([...listarClaves(localStorage), ...idsInventario()]) : new Set();
  renderListaClaves();
}

function actualizarResumenExport(){
  const n = seleccionExport.size, nIdb = [...seleccionExport].filter(k => k.startsWith('idb:')).length;
  document.getElementById('resumenExport').textContent =
    n === 0 ? 'No seleccionaste nada todavía.' : `${n - nIdb} clave(s) y ${nIdb} dato(s) de bases internas seleccionados para exportar.`;
}

function exportarSeleccion(){
  if(seleccionExport.size === 0){
    mostrarToast('⚠️ Elegí al menos una clave para exportar');
    return;
  }
  const clavesLS = [...seleccionExport].filter(k => !k.startsWith('idb:'));
  const bases = filtrarIDB(inventario, seleccionExport);
  const backup = construirBackup(clavesLS, localStorage, bases);
  const blob = new Blob([JSON.stringify(backup)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `backup-${hoyISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  mostrarToast(`⬇️ Backup descargado`);
  const lineas = [`<b>Backup descargado:</b> ${clavesLS.length} clave(s) del almacenamiento común.`];
  for(const b of bases) for(const a of b.almacenes) lineas.push(`🗄️ ${escapeHtml(b.nombre)} › ${escapeHtml(a.nombre)}: ${a.entradas.length} dato(s), ${formatearBytes(a.entradas.reduce((s, [, v]) => s + tamanioValor(v), 0))}`);
  if(!bases.some(b => b.nombre === 'bici_indoor')) lineas.push('<span style="color:var(--mal)">⚠️ No incluye «bici_indoor»: las sesiones completas de Bici NO están en este backup.</span>');
  document.getElementById('resumenDescarga').innerHTML = lineas.join('<br>');
}

/* ============ Importar ============ */
function leerArchivoBackup(event){
  const archivo = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!archivo) return;

  const lector = new FileReader();
  lector.onload = () => {
    let datos;
    try{
      datos = JSON.parse(lector.result);
    }catch(e){
      console.error('Error al parsear el backup', e);
      mostrarToast('⚠️ No pude leer ese archivo');
      return;
    }
    if(!datos || typeof datos.claves !== 'object' || datos.claves === null){
      mostrarToast('⚠️ Ese archivo no tiene el formato de backup esperado');
      return;
    }
    datosImportar = datos;
    seleccionImport = new Set(Object.keys(datos.claves));
    for(const b of (datos.indexedDB || [])) for(const a of (b.almacenes || [])) for(const [k] of (a.entradas || [])) seleccionImport.add(idbId(b.nombre, a.nombre, k));
    renderPreviaImportar();
  };
  lector.onerror = () => mostrarToast('⚠️ No pude leer ese archivo');
  lector.readAsText(archivo);
}

function toggleSeleccionImport(key){
  if(seleccionImport.has(key)) seleccionImport.delete(key); else seleccionImport.add(key);
  renderPreviaImportar();
}

function renderPreviaImportar(){
  const cont = document.getElementById('previaImportar');
  if(!datosImportar){ cont.innerHTML = ''; return; }

  const claves = Object.keys(datosImportar.claves).sort();
  const aPisar = detectarPisado(claves, localStorage);
  const fechaTexto = (() => {
    const d = new Date(datosImportar.fecha);
    return isNaN(d.getTime()) ? datosImportar.fecha : d.toLocaleString('es-AR');
  })();

  const filas = claves.map(k => {
    const checked = seleccionImport.has(k) ? 'checked' : '';
    const yaExiste = localStorage.getItem(k) !== null;
    return `<label class="item-clave">
      <input type="checkbox" ${checked} onchange="toggleSeleccionImport(${JSON.stringify(k)})">
      <span class="nombre">${escapeHtml(k)}</span>
      ${yaExiste ? '<span class="pisa">pisa datos</span>' : ''}
    </label>`;
  }).join('');

  let filasIdb = '';
  for(const b of (datosImportar.indexedDB || [])) for(const a of (b.almacenes || [])) for(const [k, v] of (a.entradas || [])){
    const id = idbId(b.nombre, a.nombre, k);
    filasIdb += `<label class="item-clave"><input type="checkbox" ${seleccionImport.has(id) ? 'checked' : ''} onchange='toggleSeleccionImport(${JSON.stringify(id)})'>
      <span class="nombre">🗄️ ${escapeHtml(b.nombre + ' › ' + (a.nombre === 'kv' ? '' : a.nombre + ' › ') + String(k))}</span><span class="peso">${formatearBytes(tamanioValor(v))}</span></label>`;
  }
  const avisos = avisosBackup(datosImportar).map(t => '<div class="aviso">⚠️ ' + escapeHtml(t) + '</div>').join('');
  cont.innerHTML = `
    ${avisos}
    <div class="tss-nota">Backup del ${escapeHtml(fechaTexto)} — ${claves.length} clave(s)${filasIdb ? ' y datos de bases internas' : ''}. ${aPisar.length} clave(s) ya existen en este dispositivo y se van a pisar si las dejás tildadas. <b>Cerrá las otras apps antes de restaurar.</b></div>
    ${filas}
    ${filasIdb ? '<div class="seccion-idb">Bases internas (IndexedDB)</div>' + filasIdb : ''}
    <button class="btn btn-primario" style="margin-top:10px;" onclick="confirmarImportar()">📥 Restaurar seleccionadas</button>
  `;
}

async function confirmarImportar(){
  if(!datosImportar) return;
  if(seleccionImport.size === 0){
    mostrarToast('⚠️ Elegí al menos una clave para restaurar');
    return;
  }
  const aPisar = detectarPisado([...seleccionImport], localStorage);
  const mensaje = aPisar.length > 0
    ? `Vas a pisar ${aPisar.length} clave(s) que ya existen en este dispositivo con los datos del backup. Esto no se puede deshacer. ¿Continuar?`
    : `¿Restaurar ${seleccionImport.size} clave(s) nuevas en este dispositivo?`;
  if(!confirm(mensaje)) return;

  const n = aplicarImportacion([...seleccionImport].filter(k => !k.startsWith('idb:')), datosImportar, localStorage);
  let informe = [];
  if((datosImportar.indexedDB || []).length){
    try{ informe = await restaurarIDB(window.indexedDB, datosImportar.indexedDB, seleccionImport); }
    catch(e){ informe = [{ base: '—', almacen: '—', escritas: 0, verificadas: 0, error: e.message }]; }
  }
  const lineas = [`<b>Restauración terminada.</b> ${n} clave(s) del almacenamiento común.`];
  for(const f of informe) lineas.push(f.error ? `<span style="color:var(--mal)">❌ ${escapeHtml(f.base)} › ${escapeHtml(f.almacen)}: ${escapeHtml(f.error)}</span>`
    : `${f.verificadas === f.escritas ? '✅' : '⚠️'} ${escapeHtml(f.base)} › ${escapeHtml(f.almacen)}: ${f.escritas} dato(s) escrito(s), ${f.verificadas} verificado(s) leyéndolos de vuelta`);
  lineas.push('Al abrir cada app, regenera sola su resumen para Mi plan.');
  mostrarToast(`✅ Restauración terminada`);
  datosImportar = null;
  seleccionImport = new Set();
  document.getElementById('previaImportar').innerHTML = '<div class="resultado">' + lineas.join('<br>') + '</div>';
  document.getElementById('inputBackup').value = '';
  cargarInventario();
}

/* ============ Inicio ============ */
renderListaClaves();
cargarInventario();
</script>
